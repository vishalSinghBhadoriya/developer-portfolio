  <style>
    #startup-loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      pointer-events: none;
      color: #f4f4f5;
      background:
        radial-gradient(ellipse at 50% 42%, #30204c, #100c1a 42%, #08090d 72%);
      overflow: hidden;
    }
    #startup-loader::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(#c4b5fd19 1px, transparent 1px),
        linear-gradient(90deg, #c4b5fd19 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse at center, #000, transparent 68%);
    }
    .startup-lockup {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 15px;
    }
    .startup-art {
      width: clamp(114px, 27vw, 154px);
      height: auto;
      overflow: visible;
    }
    .startup-orbit {
      transform-origin: 80px 80px;
      animation: startup-orbit 6s linear infinite;
    }
    .startup-crystal {
      transform-origin: 80px 80px;
      animation: startup-float 1.8s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 8px #9b6cff75);
    }
    .startup-mark {
      font: 750 25px / 1 system-ui, sans-serif;
      letter-spacing: -.09em;
    }
    .startup-mark b { color: #c4b5fd; }
    .startup-track {
      width: 116px;
      height: 2px;
      overflow: hidden;
      background: #433457;
    }
    .startup-track::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #efe5ff);
      animation: startup-scan 780ms ease-in-out infinite alternate;
    }
    .startup-label {
      font: 10px / 1.45 ui-monospace, Consolas, monospace;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: #c4b5fd;
    }
    @keyframes startup-orbit { to { transform: rotate(360deg); } }
    @keyframes startup-float { to { transform: translateY(-6px); } }
    @keyframes startup-scan { to { transform: translateX(138%); } }
    @media (prefers-reduced-motion: reduce) {
      .startup-orbit, .startup-crystal, .startup-track::after { animation: none; }
    }
  </style>
  <noscript><style>#startup-loader { display: none; }</style></noscript>
</head>
<body>
  <div id="startup-loader" role="status">
    <div class="startup-lockup">
      <svg class="startup-art" viewBox="0 0 160 160" aria-hidden="true" fill="none">
        <defs>
          <linearGradient id="startup-edge" x1="43" y1="34" x2="121" y2="124" gradientUnits="userSpaceOnUse">
            <stop stop-color="#f0e8ff" />
            <stop offset="1" stop-color="#8b5cf6" />
          </linearGradient>
        </defs>
        <circle cx="80" cy="80" r="68" stroke="#a287cc" stroke-opacity=".38" />
        <g class="startup-orbit">
          <path d="M12 80a68 68 0 0 1 68-68m0 136a68 68 0 0 0 68-68" stroke="#c4b5fd" stroke-opacity=".86" stroke-dasharray="3 6" />
          <circle cx="80" cy="12" r="3" fill="#e9dcff" />
          <circle cx="80" cy="148" r="2.5" fill="#8b5cf6" />
        </g>
        <g class="startup-crystal" stroke="url(#startup-edge)" stroke-width="1.5" stroke-linejoin="round">
          <path d="M80 33 116 75 80 126 44 75Z" fill="#8b5cf6" fill-opacity=".13" />
          <path d="m44 75 36 14 36-14M80 33v93m-36-51 36-14 36 14" />
          <circle cx="80" cy="33" r="2.5" fill="#f2eaff" stroke="none" />
          <circle cx="80" cy="126" r="2.5" fill="#c4b5fd" stroke="none" />
        </g>
      </svg>
      <span class="startup-mark" aria-hidden="true">VB<b>.</b></span>
      <div class="startup-track" aria-hidden="true"></div>
      <span class="startup-label">Loading portfolio</span>
    </div>
  </div>
  <noscript>This portfolio requires JavaScript to run.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
